<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — CONFESS</title>
  <style>
    :root { color-scheme: dark light; --bg:#090c16; --fg:#f1f4fc; --muted:#8c96b0; --primary:#4f6bff; }
    @media (prefers-color-scheme: light) { :root { --bg:#f6f7fb; --fg:#0f1424; --muted:#626d86; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; text-align:center;
      background:var(--bg); color:var(--fg); font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { max-width:380px; }
    .icon { width:64px; height:64px; margin:0 auto 20px; border-radius:20px; display:grid; place-items:center;
      background:rgba(79,107,255,.15); color:var(--primary); }
    h1 { font-size:22px; margin:0 0 8px; }
    p { margin:0 0 24px; font-size:14px; line-height:1.6; color:var(--muted); }
    button { font:inherit; font-weight:700; font-size:14px; padding:12px 22px; border:0; border-radius:14px;
      background:var(--primary); color:#fff; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.8a15 15 0 0 1 20 0M5 12.2a10 10 0 0 1 14 0M8.5 15.6a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/><path d="m3 3 18 18"/>
      </svg>
    </div>
    <h1>Kamu sedang offline</h1>
    <p>CONFESS butuh koneksi internet untuk memuat cerita terbaru. Periksa jaringanmu lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
